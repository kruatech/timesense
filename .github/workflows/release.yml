name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing (OIDC) — без хранения PYPI_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install (dev) and run tests before publish
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          flake8 timesense
          python -m timesense.tests.test_fixes --fail-only
          python -m timesense.tests.test_en_fixes --fail-only
          pytest -q

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
